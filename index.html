<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Om Knowledge OS" />
    <meta name="application-name" content="Om Knowledge OS" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Om Knowledge OS — A unified local-first second brain, task intelligence matrix, and personal operating system for Windows 11 and Samsung Galaxy S25 Ultra." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23161822'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-size='60' fill='%23818cf8'%3E%E0%A5%90%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23161822'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-size='60' fill='%23818cf8'%3E%E0%A5%90%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.json" />
    <title>Om Knowledge OS</title>
    <script>
      // Zero-latency synchronous theme bootstrapper: applies saved theme before first paint
      (function() {
        try {
          var saved = localStorage.getItem('om_knowledge_os_theme') || 'midnight-obsidian';
          var themeMap = {
            'midnight-obsidian': { bg: '#0f1117', card: '#181a24', text: '#f3f4f6', border: '#272b3b', light: false },
            'slate-monolith': { bg: '#0f172a', card: '#1e293b', text: '#f8fafc', border: '#334155', light: false },
            'deep-charcoal': { bg: '#121212', card: '#1e1e1e', text: '#f4f4f5', border: '#2e2e2e', light: false },
            'cosmic-navy': { bg: '#080c18', card: '#11182c', text: '#f1f5f9', border: '#1f2c4e', light: false },
            'emerald-forest': { bg: '#091510', card: '#12251c', text: '#f0fdf4', border: '#1b3b2b', light: false },
            'oled-pitch-black': { bg: '#000000', card: '#0a0a0a', text: '#ffffff', border: '#262626', light: false },
            'cyberpunk-amber': { bg: '#0a0802', card: '#161205', text: '#fef3c7', border: '#3b2f0c', light: false },
            'monochrome-ink': { bg: '#080808', card: '#141414', text: '#f5f5f5', border: '#2e2e2e', light: false },
            'solarized-dark': { bg: '#002b36', card: '#073642', text: '#93a1a1', border: '#586e75', light: false },
            'high-contrast-cobalt': { bg: '#030712', card: '#0f172a', text: '#f9fafb', border: '#374151', light: false },
            'white-sand': { bg: '#ffffff', card: '#ffffff', text: '#0f172a', border: '#e2e8f0', light: true },
            'nordic-snow': { bg: '#f1f5f9', card: '#ffffff', text: '#1e293b', border: '#cbd5e1', light: true },
            'vedic-parchment': { bg: '#fdfbf7', card: '#f7f2e7', text: '#292524', border: '#e2d8c3', light: true },
            'lotus-rosewater': { bg: '#fff1f2', card: '#ffffff', text: '#4c0519', border: '#fecdd3', light: true },
            'mint-dawn': { bg: '#f0fdf4', card: '#ffffff', text: '#14532d', border: '#bbf7d0', light: true }
          };
          var t = themeMap[saved] || themeMap['midnight-obsidian'];
          var root = document.documentElement;
          root.classList.add('theme-' + saved);
          if (t.light) {
            root.classList.add('light-mode');
            root.classList.remove('dark-mode');
          } else {
            root.classList.add('dark-mode');
            root.classList.remove('light-mode');
          }
          root.style.setProperty('--bg-primary', t.bg);
          root.style.setProperty('--bg-card', t.card);
          root.style.setProperty('--text-main', t.text);
          root.style.setProperty('--border-color', t.border);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t.bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500 selection:text-white" style="background-color: var(--bg-primary, #0f1117); color: var(--text-main, #f3f4f6);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
